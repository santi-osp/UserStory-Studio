<div class="page-shell">
  <app-page-header
    title="Crear Work Item desde texto"
    subtitle="Define el destino, completa la configuración y revisa el resumen antes de generar la vista previa."
  >
  </app-page-header>

  <div class="content-wrap">
    @if (!isAzdoConfigured) {
      <div class="azure-connection-guidance" role="status">
        <span>{{ azureConnectionMessage }}</span>
        <a class="btn-secondary" href="/configuracion-azure"
          >Ir a Configuración Azure</a
        >
      </div>
    }
    <form class="work-item-json-flow" [formGroup]="form">
      <app-section-card
        class="work-item-json-step-card"
        eyebrow="Paso 1"
        title="Ubicación y tipo de Work Item"
        description="Selecciona el destino y el tipo del Work Item."
      >
        <app-work-item-destination-fields
          [controls]="destinationControls"
          [projectOptions]="projectSelectOptions"
          [areaPathOptions]="areaSelectOptions"
          [iterationPathOptions]="iterationSelectOptions"
          idPrefix="work-item-json"
          [projectRequired]="isAiFieldRequired('azdoProject')"
          [areaRequired]="isAiFieldRequired('areaPath')"
          [iterationRequired]="isAiFieldRequired('iterationPath')"
          [projectError]="validationMessage('azdoProject')"
          [areaError]="validationMessage('areaPath')"
          [iterationError]="validationMessage('iterationPath')"
        >
          <app-work-item-type-selector
            work-item-type
            [controls]="destinationControls"
            [options]="workItemTypeOptions"
            inputId="work-item-json-work-item-type"
            [loading]="isLoadingWorkItemConfig"
            [error]="workItemConfigError"
          >
          </app-work-item-type-selector>
        </app-work-item-destination-fields>
        <div class="action-bar mt-6 border-t border-slate-200 pt-4">
          <button
            type="button"
            class="btn-secondary"
            [disabled]="isLoadingWorkItemConfig"
            (click)="refreshWorkItemConfig(true)"
          >
            {{
              isLoadingWorkItemConfig
                ? "Actualizando campos…"
                : "Actualizar campos del proyecto"
            }}
          </button>
        </div>
        <app-feedback-message
          [message]="warning"
          tone="warning"
        ></app-feedback-message>
        <app-feedback-message
          [message]="workItemConfigMessage"
        ></app-feedback-message>
        <app-feedback-message
          [message]="workItemConfigError"
          tone="error"
        ></app-feedback-message>
      </app-section-card>

      @if (supportsTestCasesForSelectedType && isWorkItemMetadataReady) {
        <app-section-card
          class="work-item-json-step-card"
          eyebrow="Paso 2"
          title="Configuración de Test Cases"
          description="Decide si se generarán Test Cases y define sus condiciones."
        >
          <app-test-case-generation-settings
            [controls]="testCaseControls"
            [stateOptions]="tcStateOptions"
            [testPlanOptions]="testPlanSelectOptions"
            [catalogState]="testPlanCatalogState"
            [catalogMessage]="testPlansMessage"
            [catalogError]="testPlansError"
            idPrefix="work-item-json"
            [submitAttempted]="submitAttempted"
            (retryTestPlans)="refreshTestPlans(true)"
          >
          </app-test-case-generation-settings>
        </app-section-card>
      } @else if (!supportsTestCasesForSelectedType) {
        <app-section-card
          class="work-item-json-step-card"
          eyebrow="Paso 2"
          [title]="'Test Cases no aplican para ' + selectedWorkItemType.value"
          description="Este tipo de Work Item se generará sin Test Cases."
        >
          <app-feedback-message
            message="Puedes continuar sin configurar casos de prueba."
          ></app-feedback-message>
        </app-section-card>
      } @else {
        <app-section-card
          class="work-item-json-step-card"
          eyebrow="Paso 2"
          title="Configuración de Test Cases"
          description="Disponible cuando se carguen los campos del proyecto y del tipo de Work Item."
        >
          <app-feedback-message
            [message]="
              isLoadingWorkItemConfig
                ? 'Cargando estados disponibles…'
                : workItemConfigError ||
                  'Selecciona un proyecto para continuar.'
            "
            [tone]="
              workItemConfigError
                ? 'warning'
                : isLoadingWorkItemConfig
                  ? 'loading'
                  : 'info'
            "
          ></app-feedback-message>
        </app-section-card>
      }

      <app-section-card
        class="work-item-json-step-card"
        eyebrow="Paso 3"
        title="Campos de Azure DevOps"
        description="Completa los campos configurados para el proyecto y el tipo seleccionados."
      >
        @if (dynamicFieldConfigs.length > 0) {
          <app-work-item-dynamic-fields-form
            [formGroup]="form"
            [fields]="dynamicFieldConfigs"
            [controlPrefix]="dynamicControlPrefix"
            [validationMessages]="dynamicValidationMessages"
            checkboxFieldClass="work-item-json-checkbox-field"
          >
          </app-work-item-dynamic-fields-form>
        } @else {
          <app-feedback-message
            [message]="
              isLoadingWorkItemConfig
                ? 'Cargando campos del Work Item…'
                : workItemConfigError
                  ? 'Los campos no están disponibles por un error remoto.'
                  : workItemConfigMessage ||
                    'Selecciona un proyecto para consultar sus campos.'
            "
            [tone]="
              workItemConfigError
                ? 'warning'
                : isLoadingWorkItemConfig
                  ? 'loading'
                  : 'info'
            "
          ></app-feedback-message>
        }
      </app-section-card>

      <app-section-card
        class="work-item-json-step-card"
        eyebrow="Paso 4"
        title="Información funcional"
        description="Pega el contenido funcional completo; se conservarán su alcance y significado."
      >
        <label class="field-label" for="work-item-json-source-work-item">
          <span
            >Texto funcional de origen
            @if (isAiFieldRequired("sourceWorkItemText")) {
              <app-required-field-marker></app-required-field-marker>
            }
          </span>
          <textarea
            id="work-item-json-source-work-item"
            rows="14"
            class="field-input work-item-json-source-textarea"
            placeholder="Pega aquí título, descripción, criterios de aceptación y Test Cases si aplican."
            [attr.aria-required]="
              isAiFieldRequired('sourceWorkItemText') ? 'true' : null
            "
            [attr.aria-invalid]="!!validationMessage('sourceWorkItemText')"
            [attr.aria-describedby]="
              validationMessage('sourceWorkItemText')
                ? 'work-item-json-source-work-item-error'
                : null
            "
            formControlName="sourceWorkItemText"
          ></textarea>
          <app-field-validation-message
            [message]="validationMessage('sourceWorkItemText')"
            messageId="work-item-json-source-work-item-error"
          ></app-field-validation-message>
        </label>
      </app-section-card>

      <app-section-card
        class="work-item-json-step-card work-item-json-action-card"
        eyebrow="Paso 5"
        title="Generación de vista previa"
        description="Valida la información y prepara directamente una versión editable en Preview."
      >
        <div class="work-item-json-action-layout">
          <div class="action-bar work-item-json-main-actions">
            <button
              type="button"
              class="btn-primary"
              [disabled]="isSubmittingPreview"
              [attr.aria-busy]="isSubmittingPreview"
              (click)="sendToAi()"
            >
              @if (isSubmittingPreview) {
                <app-loading-spinner size="small"></app-loading-spinner>
              }
              {{
                isSubmittingPreview
                  ? "Preparando vista previa…"
                  : "Generar vista previa"
              }}
            </button>
          </div>
          <div class="action-bar work-item-json-utility-actions">
            <button type="button" class="btn-muted" (click)="resetForm()">
              Reiniciar formulario
            </button>
          </div>
        </div>
        <app-feedback-message
          [message]="message"
          tone="success"
        ></app-feedback-message>
        <app-feedback-message
          [message]="error"
          tone="error"
        ></app-feedback-message>
      </app-section-card>
    </form>
  </div>
</div>
