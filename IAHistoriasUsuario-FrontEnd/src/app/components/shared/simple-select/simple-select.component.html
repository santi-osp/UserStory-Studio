<div class="path-picker">
  <div class="path-picker-head">
    <button
      #selectButton
      type="button"
      class="field-input field-input-button pr-12"
      [attr.id]="inputId || null"
      [disabled]="disabled"
      [attr.aria-expanded]="isOpen"
      [attr.aria-required]="required ? 'true' : null"
      [attr.aria-invalid]="invalid ? 'true' : null"
      [attr.aria-describedby]="describedBy || null"
      (click)="toggleOpen($event)"
    >
      {{ displayValue || placeholder }}
    </button>
    <button
      type="button"
      class="path-picker-toggle"
      [disabled]="disabled"
      [attr.aria-expanded]="isOpen"
      [attr.aria-label]="ariaLabel"
      (click)="toggleOpen($event)"
    >
      <svg
        aria-hidden="true"
        class="h-4 w-4"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="m6 9 6 6 6-6"></path>
      </svg>
    </button>
  </div>

  @if (isOpen) {
    <div class="path-picker-panel" role="listbox">
      @if (clearable) {
        <button
          type="button"
          class="path-picker-option"
          [class.path-picker-option-selected]="!displayValue"
          (mousedown)="clearSelection($event)"
        >
          <span class="path-picker-main">{{ placeholder }}</span>
        </button>
      }

      @if (normalizedOptions.length === 0) {
        <p class="path-picker-empty">No hay opciones disponibles.</p>
      }

      @for (option of normalizedOptions; track option.value) {
        <button
          type="button"
          class="path-picker-option"
          [class.path-picker-option-selected]="isSelected(option)"
          (mousedown)="selectOption(option, $event)"
        >
          <span class="path-picker-main">{{ option.label }}</span>
        </button>
      }
    </div>
  }
</div>
